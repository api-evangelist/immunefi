apis:
- aid: immunefi:bounties
  name: Immunefi Bug Bounty Programs API
  description: >-
    An unauthenticated, read-only JSON endpoint published on Immunefi's own domain that returns the
    complete catalog of bug bounty programs listed on the platform. Each record carries the project
    name and slug, program and product type, ecosystems, languages, maximum bounty, reward token,
    KYC and invite-only flags, launch and update dates, the full assets-in-scope list, the reward
    table keyed by severity and asset type, prioritized and out-of-scope impacts, program overview
    and rules prose, and any linked audits. The route serves the entire collection as a single JSON
    array; there is no filtering, pagination, or per-program path.
  humanURL: https://immunefi.com/bug-bounty/
  baseURL: https://immunefi.com/public-api
