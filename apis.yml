aid: immunefi
name: Immunefi
description: >-
  Immunefi is a crowdsourced web3 security platform that operates the largest onchain bug bounty
  ecosystem, connecting security researchers with blockchain protocols and rewarding them for
  responsibly disclosed vulnerabilities. Alongside bug bounties it runs audit competitions and
  attackathons, PR reviews, Safe Harbor agreements, onchain monitoring, and Magnus, a unified
  security command center. Immunefi authors and versions the Immunefi Vulnerability Severity
  Classification System, the severity taxonomy most web3 bounty programs are written against.
  Its only public machine-readable surface is an unauthenticated JSON endpoint at
  immunefi.com/public-api/bounties.json that returns the full catalog of live bug bounty programs,
  including assets in scope, reward tables by severity, impacts, ecosystems and program metadata.
